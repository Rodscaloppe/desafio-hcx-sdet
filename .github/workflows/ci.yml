name: Qualidade Contínua - Desafio HCX SDET

on:
  push:
    branches: [main]
  pull_request:
  # Execução manual permite disparar suítes específicas (ex.: trello-auth).
  workflow_dispatch:

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
  AE_API_URL: ${{ vars.AE_API_URL || 'https://automationexercise.com/api' }}

# NOTA DE AMBIENTE (observada em execuções reais): o site público fica atrás
# de Cloudflare e, dependendo do IP de saída do runner hospedado, responde
# 403/challenge para /api/* ou até loop de challenge na navegação. Por isso
# cada job de teste faz PRÉ-CHECAGEM de acessibilidade:
#   - ambiente acessível  -> suíte executa de verdade e o job falha se um
#                            teste obrigatório falhar (gate real);
#   - ambiente bloqueado  -> job conclui com ::warning:: explícito, cenários
#                            AUSENTES do relatório (nunca verde por omissão)
#                            e evidência da sondagem publicada nos artefatos.

jobs:
  lint:
    name: Análise estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  smoke:
    name: Smoke (sanidade rápida)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-checagem de acessibilidade do site
        id: probe
        run: node scripts/check-web-reachability.mjs
      - uses: cypress-io/github-action@v6
        if: steps.probe.outputs.reachable == 'true'
        with:
          install-command: npm ci
          command: npm run test:smoke
      - name: Aviso de bloqueio de ambiente
        if: steps.probe.outputs.reachable == 'false'
        run: echo "::warning::Site público sob challenge anti-bot neste runner; suíte smoke não executada — evidência em probe-web.json nos artefatos."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-smoke
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos
            cypress/evidencias
          if-no-files-found: ignore

  e2e:
    name: E2E Web (suíte obrigatória)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-checagem de acessibilidade do site
        id: probe
        run: node scripts/check-web-reachability.mjs
      - uses: cypress-io/github-action@v6
        if: steps.probe.outputs.reachable == 'true'
        with:
          install-command: npm ci
          command: npm run test:e2e
      - name: Aviso de bloqueio de ambiente
        if: steps.probe.outputs.reachable == 'false'
        run: echo "::warning::Site público sob challenge anti-bot neste runner; suíte E2E não executada — evidência em probe-web.json nos artefatos."
      - name: Relatório e evidências
        if: always() && steps.probe.outputs.reachable == 'true'
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-e2e
          path: cypress/evidencias
          if-no-files-found: ignore

  api:
    name: API (suíte obrigatória)
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-checagem de acessibilidade da API externa
        id: probe
        # Sonda /api/verifyLogin com credenciais inertes. A API pública
        # bloqueia IPs de datacenter (Cloudflare 403); a sondagem classifica
        # o ambiente e grava evidência em cypress/evidencias/probe-api.json.
        run: node scripts/check-api-reachability.mjs
      - uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          # Modo controlado: suíte completa se acessível; senão, apenas os
          # contratos API-01 (independentes do site) + aviso de bloqueio.
          # API-02 bloqueada NUNCA é reportada como sucesso: fica ausente do
          # relatório, com a evidência do probe publicada nos artefatos.
          command: bash scripts/run-api-suite.sh ${{ steps.probe.outputs.reachable }}
      - name: Relatório e evidências
        if: always()
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-api
          path: cypress/evidencias
          if-no-files-found: ignore

  trello-auth:
    name: API Trello autenticada (modo controlado)
    # Só executa quando os segredos estão configurados; caso contrário o job
    # é pulado de forma explícita (e não "verde por omissão").
    if: ${{ vars.TRELLO_CONFIGURED == 'true' }}
    needs: api
    runs-on: ubuntu-latest
    env:
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
      TRELLO_LIST_ID: ${{ vars.TRELLO_LIST_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          command: npm run test:api:trello
      - name: Relatório e evidências
        if: always()
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-trello
          path: cypress/evidencias
          if-no-files-found: ignore

  known-issues:
    name: Defeitos conhecidos (informativo, não bloqueante)
    # Executa os cenários @known-issue para gerar evidência atualizada dos
    # defeitos de produto já registrados. Nunca aprova o pipeline: é
    # informativo por natureza (a falha é o comportamento esperado do teste).
    continue-on-error: true
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pré-checagem de acessibilidade do site
        id: probe
        run: node scripts/check-web-reachability.mjs
      - uses: cypress-io/github-action@v6
        if: steps.probe.outputs.reachable == 'true'
        with:
          install-command: npm ci
          command: npm run test:known-issues
      - name: Aviso de bloqueio de ambiente
        if: steps.probe.outputs.reachable == 'false'
        run: echo "::warning::Site público sob challenge anti-bot neste runner; suíte de defeitos conhecidos não executada — evidência em probe-web.json nos artefatos."
      - name: Relatório e evidências
        if: always() && steps.probe.outputs.reachable == 'true'
        run: npm run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-known-issues
          path: cypress/evidencias
          if-no-files-found: ignore
